<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Answers - WABOT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: #ef4444;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            color: var(--text-dim);
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding-left: 1rem;
            padding-right: 1rem;
            padding-top: 0.1em;
            padding-bottom: 0.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            max-width: 300px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-dim);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div>
                <h1>ISP Answers</h1>
                <p style="color: var(--text-dim); margin-top: 0.25rem;">Manage keyword-based answers for ISP Bot</p>
            </div>
            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/history.html">History</a>
                <a href="/users">Users</a>
                <a href="/settings">Settings</a>
                <a href="/isp-answers" style="color: var(--primary);">Jawaban ISP</a>
                <a href="/ai-knowledge">Pengetahuan AI</a>
                <a href="/logout" style="color: #f87171;">Logout</a>
            </div>
        </header>

        <div class="card" style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; justify-content: flex-end; width: 100%;">
                <button class="btn btn-primary" onclick="openModal()">+ Add New Answer</button>
            </div>

            <table id="dataTable">
                <thead>
                    <tr>
                        <th width="15%">Keywords</th>
                        <th width="75%">Answer</th>
                        <th width="10%">Actions</th>
                    </tr>
                </thead>
                <tbody id="dataList">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-top: 0;">Add Answer</h2>
            <form id="dataForm">
                <input type="hidden" id="dataId">
                <div class="form-group">
                    <label>Keywords <span style="font-size: 0.7rem; color: var(--text-dim);">(Use % for LIKE search, or
                            comma separated like "halo","hai")</span></label>
                    <input type="text" id="keywords" required placeholder='"halo","hai" atau %gangguan%'>
                </div>
                <div class="form-group">
                    <label>Answer</label>
                    <textarea id="answer" required placeholder="Jawaban bot..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()"
                        style="background: transparent; color: var(--text-dim);">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let dataList = [];

        async function fetchData() {
            const response = await fetch('/api/isp-answers');
            if (response.ok) {
                dataList = await response.json();
                renderData();
            }
        }

        function renderData() {
            const tbody = document.getElementById('dataList');
            tbody.innerHTML = dataList.map(item => `
                <tr>
                    <td>${item.keywords}</td>
                    <td>${item.answer.length > 200 ? item.answer.substring(0, 200) + '...' : item.answer}</td>
                    <td>
                        <button class="btn" onclick="editData(${item.id})" style="padding: 0.4rem; background: rgba(59, 130, 246, 0.1); color: #60a5fa;">Edit</button>
                        <button class="btn btn-danger" onclick="deleteData(${item.id})" style="padding: 0.4rem;">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(item = null) {
            const modal = document.getElementById('dataModal');
            const title = document.getElementById('modalTitle');

            if (item) {
                title.textContent = 'Edit Answer';
                document.getElementById('dataId').value = item.id;
                document.getElementById('keywords').value = item.keywords;
                document.getElementById('answer').value = item.answer;
            } else {
                title.textContent = 'Add Answer';
                document.getElementById('dataForm').reset();
                document.getElementById('dataId').value = '';
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('dataModal').style.display = 'none';
        }

        function editData(id) {
            const item = dataList.find(u => u.id === id);
            if (item) openModal(item);
        }

        async function deleteData(id) {
            if (!confirm('Are you sure you want to delete this answer?')) return;

            const response = await fetch(`/api/isp-answers/${id}`, { method: 'DELETE' });
            if (response.ok) fetchData();
        }

        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('dataId').value;
            const payload = {
                keywords: document.getElementById('keywords').value,
                answer: document.getElementById('answer').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/isp-answers/${id}` : '/api/isp-answers';

            const response = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                closeModal();
                fetchData();
            } else {
                alert('Error saving data');
            }
        });

        fetchData();
    </script>
</body>

</html>
